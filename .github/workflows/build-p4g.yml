name: Build P4G APK
on:
  workflow_dispatch:
    inputs:
      title_id:
        default: 'PCSE00120'
        required: true
      build_mode:
        default: 'fast_patch'
        required: true
        type: choice
        options: [fast_patch, full_build]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || echo "no wrapper, using gradle"
          gradle assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Persona-4-Golden-APK
          path: app/build/outputs/apk/debug/*.apk
