name: Build P4G APK

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Title ID'
        required: true
        default: 'PCSE00120'
      build_mode:
        description: 'Mode'
        required: true
        default: 'fast_patch'
        type: choice
        options:
          - fast_patch
          - full_build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK Placeholder
        run: |
          echo "Building ${{ inputs.title_id }} mode ${{ inputs.build_mode }}"
          mkdir -p app/build/outputs/apk/debug
          echo "Build success for ${{ inputs.title_id }}" > app/build/outputs/apk/debug/README.txt
          echo "P4G APK Build - ${{ inputs.title_id }} - ${{ inputs.build_mode }}" > app/build/outputs/apk/debug/build-info.txt
          date >> app/build/outputs/apk/debug/build-info.txt
          # Nanti disini lu taruh ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Persona-4-Golden-APK
          path: app/build/outputs/apk/debug/
