name: Build P4G APK

on:
  workflow_dispatch:
    inputs:
      title_id:
        description: 'Title ID'
        required: true
        default: 'PCSE00120'
      build_mode:
        description: 'Mode'
        required: true
        default: 'fast_patch'
        type: choice
        options:
          - fast_patch
          - full_build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          echo "Building ${{ inputs.title_id }} mode ${{ inputs.build_mode }}"
          mkdir -p app/build/outputs/apk/debug
          echo "APK Placeholder - isi build logic lu disini" > app/build/outputs/apk/debug/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Persona-4-Golden-APK
          path: app/build/outputs/apk/debug/
