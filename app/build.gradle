plugins { id 'com.android.application' }
android {
    namespace 'com.p4g.cloud'
    compileSdk 34
    defaultConfig {
        applicationId "com.p4g.cloud"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {}
